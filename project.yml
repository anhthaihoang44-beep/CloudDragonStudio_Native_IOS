name: CloudDragonStudio
options:
  bundleIdPrefix: com.clouddragonstudio
  deploymentTarget:
    iOS: "16.0"
  xcodeVersion: "15.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1,2"
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    GENERATE_INFOPLIST_FILE: "NO"
    SWIFT_TREAT_WARNINGS_AS_ERRORS: "YES"
    SWIFT_EMIT_LOC_STRINGS: "NO"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: "Manual"

targets:
  CloudDragonStudio:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: CloudDragonStudio
        excludes:
          - Resources/Info.plist
          - Resources/CloudDragonStudio.storekit
    info:
      path: CloudDragonStudio/Resources/Info.plist
      properties:
        CFBundleDisplayName: Cloud Dragon Studio
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        ITSAppUsesNonExemptEncryption: false
        NSPhotoLibraryAddUsageDescription: Cloud Dragon Studio saves your dragon keepsake photos to your photo library when you choose Export.
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.clouddragonstudio.app
        INFOPLIST_FILE: CloudDragonStudio/Resources/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        PRIVACY_MANIFEST_FILE: CloudDragonStudio/Resources/PrivacyInfo.xcprivacy

  CloudDragonStudioTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: Tests/CloudDragonStudioTests
    dependencies:
      - target: CloudDragonStudio
    settings:
      base:
        GENERATE_INFOPLIST_FILE: "YES"
        PRODUCT_BUNDLE_IDENTIFIER: com.clouddragonstudio.tests

  CloudDragonStudioUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: Tests/CloudDragonStudioUITests
    dependencies:
      - target: CloudDragonStudio
    settings:
      base:
        GENERATE_INFOPLIST_FILE: "YES"
        PRODUCT_BUNDLE_IDENTIFIER: com.clouddragonstudio.uitests
        TEST_TARGET_NAME: CloudDragonStudio

schemes:
  CloudDragonStudio:
    build:
      targets:
        CloudDragonStudio: all
        CloudDragonStudioTests: [test]
        CloudDragonStudioUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - CloudDragonStudioTests
        - CloudDragonStudioUITests
    archive:
      config: Release
